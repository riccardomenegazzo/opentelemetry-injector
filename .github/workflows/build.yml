name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build-binary:
    runs-on: ${{ matrix.ARCH == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        ARCH: [ "amd64", "arm64"]
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      - name: lint source code
        run: |
          make lint

      - name: Run Zig unit tests
        run: make zig-unit-tests ARCH=${{ matrix.ARCH }}

      - name: Build binary
        run: make dist ARCH=${{ matrix.ARCH }}

      - name: Run Injector integration tests
        run: make injector-integration-tests-for-one-architecture ARCH=${{ matrix.ARCH }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libotelinject-${{ matrix.ARCH }}
          path: ./dist/*.so
          if-no-files-found: error

  sign-release-artifacts:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'open-telemetry/opentelemetry-injector'
    needs: verify-and-build-binary
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts/

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find artifacts -type f -name 'libotelinject_*.so' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found to sign."
            exit 1
          fi

          for artifact in "${files[@]}"; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done

      - name: Verify release artifact signatures
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/tags/${{ github.ref_name }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find artifacts -type f -name 'libotelinject_*.so' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found to verify."
            exit 1
          fi

          for artifact in "${files[@]}"; do
            bundle="${artifact}.sigstore.json"
            if [[ ! -f "${bundle}" ]]; then
              echo "Missing Sigstore bundle for ${artifact}."
              exit 1
            fi

            cosign verify-blob "${artifact}" \
              --bundle "${bundle}" \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}"
          done

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-artifacts
          path: ./artifacts/
          if-no-files-found: error
          retention-days: 1

  publish-stable:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'open-telemetry/opentelemetry-injector'
    needs: sign-release-artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: mkdir -p artifacts

      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-artifacts
          path: ./artifacts/

      - name: Prepare release notes
        run: ./.github/workflows/scripts/prepare-release-notes.sh
        env:
          RELEASE_TAG: ${{ steps.github_tag.outputs.tag }}

      - name: debug release artifacts
        shell: bash
        run: |
          set -x
          pwd
          ls -la .
          ls -laR /home/runner/work/opentelemetry-injector/opentelemetry-injector/artifacts || true
          ls -laR artifacts || true

      - name: Release
        env:
          DRAFT: ${{ contains(github.ref_name, '-rc.') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found."
            exit 1
          fi

          args=(release create "$GITHUB_REF_NAME" "${files[@]}" --notes-file release-notes.md --verify-tag)
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          gh "${args[@]}"
